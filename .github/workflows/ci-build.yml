name: Build unstable

on: [push, workflow_dispatch]

concurrency: 
  group: gradle

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout entity-fishing
      uses: actions/checkout@v4
      with:
        path: ./entity-fishing
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    # grobid-core/grobid-trainer 0.9.1 and grobid-ner 0.8.2 are vendored in
    # entity-fishing/lib, so no grobid/grobid-ner checkout or build is needed to
    # compile. grobid-ner has no 0.9.x release and its Gradle 7.2 build cannot run
    # on JDK 21, so its model-install step is dropped; `build -x test` needs no models.
    - name: Build entity-fishing with Gradle
      working-directory: entity-fishing
      run: ./gradlew build -x test


  docker-build:
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - name: Create more disk space
        run: |
          sudo rm -rf /usr/share/dotnet 
          sudo rm -rf /opt/ghc 
          sudo rm -rf "/usr/local/share/boost" 
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v4
      - name: Build and push
        id: docker_build
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: lfoppiano/entity-fishing
          registry: docker.io
          pushImage: false
          tags: latest-develop
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}